<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notes</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16171a" />
    <script>
      // Apply the saved appearance before the first paint, including offline.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("notes.theme") === "light" ? "light" : "dark";
      } catch { /* Keep the default dark theme when storage is blocked. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
