# Builds a signed release APK on every push to main and attaches it to a
# rolling `android-apk` release. The phone installs from that release page:
# download, tap, done — no cable, no SDK, no commands.
#
# Updates install over each other for two reasons, both load-bearing:
# - every build is signed with the same keystore (repo secrets below), and
# - versionCode is the run number, so each build is newer than the last.
name: android-apk

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: bun install
      - run: bun run build
      - run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/notes-release.p12

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: /tmp/notes-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # The Gradle signing block silently skips when the secrets are missing,
      # which would publish an uninstallable APK. Fail here instead.
      - name: Verify the APK is signed
        run: |
          apksigner="$ANDROID_HOME/build-tools/"*/apksigner
          $apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Android APK (latest)"
          body: "Sideload build of ${{ github.sha }}. Download, tap to install, allow unknown apps once. Updates install over the previous build."
          files: android/app/build/outputs/apk/release/app-release.apk
