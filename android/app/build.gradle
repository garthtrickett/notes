apply plugin: 'com.android.application'

// The run number makes each CI build newer than the last, which is what lets
// Android install it over the previous one. Written as an explicit null check:
// the Elvis form fails evaluation here with "Value is null".
static int runNumber() {
    String run = System.getenv("GITHUB_RUN_NUMBER");
    return run != null ? run.toInteger() : 1;
}

android {
    namespace = "com.garthtrickett.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.garthtrickett.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The run number makes each CI build newer than the last, which is what
        // lets Android install it over the previous one. Written as an explicit
        // null check: the Elvis form fails evaluation here with "Value is null".
        versionCode runNumber()
        versionName "1.0.${runNumber()}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI signs every build with the same keystore (see .github/workflows/android-apk.yml),
    // so updates install over each other. Locally the file is absent and release
    // builds stay unsigned, exactly as before.
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "notes"
                keyPassword System.getenv("KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's Conscrypt TLS peer uses InetAddress on the host JDK.
            jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED'
            maxHeapSize = '1024m'
            maxParallelForks = 1
            testLogging {
                exceptionFormat = 'full'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
    implementation 'com.hierynomus:sshj:0.41.0'
    // Avoid selecting Android's reduced BC provider for SSH cryptography.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-inspector:$media3Version"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Exercise the native journal parser on the JVM instead of Android's JSON stubs.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyPushConfiguration') {
    doLast {
        def source = file('google-services.json')
        if (!source.isFile()) throw new GradleException('Firebase app configuration is required for the release APK.')
        def config = new groovy.json.JsonSlurper().parse(source)
        def client = config.client.find { it.client_info.android_client_info.package_name == 'com.garthtrickett.notes' }
        if (config.project_info.project_id != 'notes-512403' || config.project_info.project_number != '103880188180' ||
            client == null || !client.client_info.mobilesdk_app_id.startsWith('1:103880188180:android:') ||
            !client.api_key?.any { it.current_key })
            throw new GradleException('Firebase app configuration does not match the Notes project/package.')
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { dependsOn 'verifyPushConfiguration' }
